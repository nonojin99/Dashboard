<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Library</title>
<style>
  :root {
    --bg: #07080f;
    --card: #12141f;
    --card-hover: #1a1d2e;
    --line: #ffffff12;
    --text: #eef0f6;
    --muted: #9aa3b5;
    --accent: #c4f542;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #2a1b5e55, transparent),
      radial-gradient(900px 500px at 90% 0%, #1b3a5e44, transparent),
      var(--bg);
    color: var(--text);
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .eyebrow {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: #a78bfa; font-weight: 600; margin-bottom: 10px;
  }
  h1 {
    font-size: clamp(2rem, 4vw, 2.75rem);
    font-weight: 700; letter-spacing: -0.03em; margin-bottom: 22px;
  }
  h1 span {
    background: linear-gradient(90deg, #e9d5ff, #a5b4fc, #c4f542);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    margin-bottom: 28px;
  }
  .search {
    flex: 1; min-width: 200px; max-width: 420px;
    display: flex; align-items: center; gap: 10px;
    background: #0e1018; border: 1px solid var(--line);
    border-radius: 999px; padding: 12px 16px;
  }
  .search svg { opacity: .45; flex-shrink: 0; }
  .search input {
    flex: 1; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; font-size: 14px;
  }
  .search input::placeholder { color: #6b7280; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters button {
    border: 1px solid var(--line); background: #0e1018; color: var(--muted);
    border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 13px;
    cursor: pointer; transition: .15s ease;
  }
  .filters button:hover { color: var(--text); border-color: #ffffff28; }
  .filters button.on {
    background: var(--accent); color: #0b1200; border-color: transparent; font-weight: 700;
  }
  .count { margin-left: auto; font-size: 12px; color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }
  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden; text-decoration: none; color: inherit;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #ffffff22;
    background: var(--card-hover);
  }
  .thumb {
    aspect-ratio: 16/10; position: relative; overflow: hidden;
    background: #0a0c14;
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .35s ease;
  }
  .card:hover .thumb img { transform: scale(1.05); }
  .thumb .star {
    position: absolute; top: 10px; right: 10px;
    width: 32px; height: 32px; border-radius: 10px;
    background: #0008; border: 1px solid #ffffff18;
    display: grid; place-items: center; cursor: pointer;
    color: #fff8; font-size: 14px; backdrop-filter: blur(6px);
    z-index: 2;
  }
  .thumb .star.on { color: #fbbf24; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--t, #a5b4fc); opacity: .9; font-weight: 600;
  }
  .tag::after { content: "·"; margin-left: 6px; color: #ffffff33; }
  .tag:last-child::after { content: ""; margin: 0; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .desc {
    font-size: 13px; line-height: 1.5; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .foot {
    margin-top: auto; padding-top: 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--line); font-size: 11px; color: #7c8498;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .foot .go {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: #ffffff0d; border: 1px solid #ffffff14;
    transition: .15s ease;
  }
  .card:hover .foot .go { background: var(--accent); color: #0b1200; border-color: transparent; }
  .empty {
    grid-column: 1 / -1; text-align: center; padding: 48px 16px;
    color: var(--muted); font-size: 14px;
  }
  .ethumb {
    width: 100%; height: 100%; display: grid; place-items: center;
    font-size: 56px;
    background: radial-gradient(120% 120% at 20% 0%, #2a1b5e66, transparent), #0a0c14;
    transition: transform .35s ease;
  }
  .card:hover .ethumb { transform: scale(1.08); }
  footer {
    margin-top: 40px; text-align: center; font-size: 12px; color: #5b6475;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Choose your next obsession</div>
  <h1>Game <span>library</span></h1>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/>
      </svg>
      <input id="q" type="search" placeholder="게임이나 장르 검색…" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
  </div>

  <div class="grid" id="grid"></div>
  <footer>nonojin · GitHub Pages & Render</footer>
</div>

<script>

    url: 'https://jumptogether.onrender.com/',

  },
  {
    id: 'fortress',
    title: '포트리스',
    desc: '각도와 파워로 포를 쏘아 상대 요새를 무너뜨리는 턴제 포격 게임.',
    url: 'https://nonojin99.github.io/Fortress/',
    cats: ['전략', '아케이드'],
    badge: '턴제',
    img: 'thumbs/fortress.jpg',
    t: '#fdba74'
  },
  {
    id: 'tetris',
    title: '테트리스',
    desc: '클래식 블록 퍼즐. 줄을 지우고 스택을 지켜 보세요.',
    url: 'https://honeybadger9999.github.io/Tetris-BJ/',
    cats: ['퍼즐', '클래식'],
    badge: '클래식',
    img: 'thumbs/tetris.jpg',
    t: '#c4b5fd'
  },
  {
    id: 'brick',
    title: '벽돌깨기 1vs1',
    desc: '실시간 대전으로 벽돌을 깨는 1대1 아케이드.',
    url: 'https://nonojin99.github.io/Brick-breakers/',
    cats: ['아케이드', '멀티', '대전'],
    badge: '1vs1',
    img: 'thumbs/brick.jpg',
    t: '#f9a8d4'
  },
  {
    id: 'poop',
    title: '똥피하기',
    desc: '하늘에서 떨어지는 걸 피하며 버텨 보세요.',
    url: 'https://nonojin99.github.io/Poop-Dodge/',
    cats: ['아케이드', '캐주얼'],
    badge: '캐주얼',
    img: 'thumbs/poop.jpg',
    t: '#fbbf24'
  },
  {
    id: '2048',
    title: '2048',
    desc: '같은 수를 합쳐 2048을 만드는 머지 퍼즐.',
    url: 'https://nonojin99.github.io/Leaf-io/',
    cats: ['퍼즐'],
    badge: '머지',
    img: 'thumbs/2048.jpg',
    t: '#6ee7b7'
  },
  {
    id: 'suika',
    title: '수박게임',
    desc: '같은 과일을 합쳐 수박을 만드는 물리 퍼즐.',
    url: 'https://nonojin99.github.io/-/',
    cats: ['퍼즐', '캐주얼'],
    badge: '물리',
    img: 'thumbs/suika.jpg',
    t: '#fda4af'
  },
  {
    id: 'cater',
    title: '애벌레 땅따먹기',
    desc: '영역을 넓히며 경쟁하는 멀티 테리토리 게임.',
    url: 'https://caterpiller-territory-game.onrender.com',
    cats: ['멀티', '전략'],
    badge: '멀티플레이',
    img: 'thumbs/cater.jpg',
    t: '#a3e635'
  },
  {
    id: 'billiards',
    title: '당구',
    desc: '각과 힘을 겨루는 당구 시뮬레이션.',
    url: 'https://nonojin99.github.io/billiards/',
    cats: ['스포츠', '시뮬레이션'],
    badge: '스포츠',
    img: 'thumbs/billiards.jpg',
    t: '#7dd3fc'
  },
  {
    id: 'constellation',
    title: '별자리 항해',
    desc: '밤하늘을 여행하며 별자리를 탐험하는 인터랙티브 투어.',
    url: 'https://nonojin99.github.io/constellation-voyage/',
    cats: ['탐험', '인터랙티브'],
    badge: '탐험',
    img: 'thumbs/constellation.jpg',
    t: '#a5b4fc'
  },
  {
    id: 'cardnews',
    title: '일일 카드뉴스',
    desc: '매일 쌓이는 카드뉴스 콘텐츠 뷰어.',
    url: 'https://nonojin99.github.io/Daily-Card-News/',
    cats: ['콘텐츠'],
    badge: '콘텐츠',
    img: 'thumbs/cardnews.jpg',
    t: '#fdba74'
  },
  {
    id: 'beat',
    title: 'BEATDROP',
    desc: '4키·6키 리듬 게임. 노트를 타이밍에 맞춰 정확도와 콤보를 쌓아 스테이지를 클리어하세요.',
    url: 'https://nonojin99.github.io/Beat/',
    cats: ['리듬', '아케이드'],
    badge: '리듬',
    img: 'thumbs/beat.jpg',
    t: '#22d3ee'
  },
  {
    id: 'royale',
    title: 'Royale',
    desc: '실시간 전략(RTS) 게임. 기지를 건설하고 병력을 생산·확장해 적 진영을 무너뜨리세요.',
    url: 'https://royale-ii59.onrender.com',
    cats: ['전략', '멀티'],
    badge: 'RTS',
    img: 'thumbs/royale.jpg',
    t: '#60a5fa'
  },
  {
    id: 'stack',
    title: 'STACK! 3D',
    desc: '앞뒤·좌우에서 날아오는 박스를 타이밍에 맞춰 떨어뜨려 쌓아 올리세요. 겹친 부분만 남고 빗나가면 게임 오버!',
    url: 'https://nonojin99.github.io/Stack/',
    cats: ['아케이드', '캐주얼'],
    badge: '스택',
    img: 'thumbs/stack.jpg',
    t: '#fbbf24'
  }
];

const FILTERS = ['전체', 'DAILY', '멀티', '퍼즐', '아케이드', '캐주얼', '전략', '스포츠', '탐험', '콘텐츠', '리듬', '클래식', '대전'];

/* ===== Daily Games (Supabase에서 자동 로드 — 새 게임이 나오면 자동 반영) ===== */
const DAILY_API = 'https://fpjgjwazqpfiffnsgume.supabase.co/rest/v1/games'
  + '?select=slug,title,day,description,published_on,emoji&order=day.desc';
const DAILY_KEY = 'sb_publishable_I1YgcnYNBOaGy0WwozO2wQ_PGwsLtU5';
const DAILY_BASE = 'https://daily-games-afim.onrender.com/games/';
const DAILY_COLORS = ['#c4f542', '#22d3ee', '#f9a8d4', '#fbbf24', '#a5b4fc', '#6ee7b7', '#fdba74'];

fetch(DAILY_API, { headers: { apikey: DAILY_KEY, Authorization: 'Bearer ' + DAILY_KEY } })
  .then(r => r.ok ? r.json() : [])
  .then(rows => {
    rows.forEach(g => GAMES.push({
      id: 'daily-' + g.slug,
      title: g.title,
      desc: `DAY ${g.day} · ${g.description}`,
      url: DAILY_BASE + g.slug + '/',
      cats: ['DAILY'],
      badge: 'DAY ' + g.day,
      emoji: g.emoji || '🎮',
      t: DAILY_COLORS[g.day % DAILY_COLORS.length]
    }));
    if (rows.length) render();
  })
  .catch(() => {}); // 실패해도 기존 목록은 정상 표시

const favKey = 'gl_favs';
const favs = new Set(JSON.parse(localStorage.getItem(favKey) || '[]'));

const filtersEl = document.getElementById('filters');
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const count = document.getElementById('count');
let active = '전체';

FILTERS.forEach(f => {
  const b = document.createElement('button');
  b.textContent = f;
  if (f === active) b.classList.add('on');
  b.onclick = () => {
    active = f;
    [...filtersEl.children].forEach(x => x.classList.toggle('on', x.textContent === f));
    render();
  };
  filtersEl.appendChild(b);
});

q.addEventListener('input', render);

function render() {
  const term = q.value.trim().toLowerCase();
  const list = GAMES.filter(g => {
    const byCat = active === '전체' || g.cats.includes(active);
    const byQ = !term || g.title.toLowerCase().includes(term)
      || g.desc.toLowerCase().includes(term)
      || g.cats.some(c => c.toLowerCase().includes(term));
    return byCat && byQ;
  });

  count.textContent = list.length + ' GAMES';
  grid.innerHTML = '';

  if (!list.length) {
    grid.innerHTML = '<div class="empty">검색 결과가 없습니다</div>';
    return;
  }

  list.forEach(g => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `
      <div class="thumb">
        ${g.img ? `<img src="${g.img}" alt="${g.title}" loading="lazy">` : `<div class="ethumb">${g.emoji || '🎮'}</div>`}
        <button type="button" class="star ${favs.has(g.id) ? 'on' : ''}" data-id="${g.id}" title="즐겨찾기">★</button>
      </div>
      <div class="body">
        <div class="tags">${g.cats.map(c => `<span class="tag" style="--t:${g.t}">${c}</span>`).join('')}</div>
        <div class="title">${g.title}</div>
        <div class="desc">${g.desc}</div>
        <div class="foot">
          <span>${g.badge}</span>
          <span class="go">→</span>
        </div>
      </div>`;
    a.querySelector('.star').addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      if (favs.has(g.id)) favs.delete(g.id); else favs.add(g.id);
      localStorage.setItem(favKey, JSON.stringify([...favs]));
      e.currentTarget.classList.toggle('on', favs.has(g.id));
    });
    grid.appendChild(a);
  });
}

render();
</script>
</body>
</html>
